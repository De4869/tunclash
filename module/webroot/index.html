<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TunClash</title>
<style>
  :root{
    --bg:#05070d; --bg2:#0a0e18; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.03);
    --line:rgba(255,255,255,.08); --text:#e9edf7; --dim:#8a93a8; --faint:#5a6377;
    --blue:#5b8cff; --cyan:#22d3ee; --ok:#34d399; --warn:#fbbf24; --red:#fb7185;
    --glass:rgba(14,19,30,.80); --pill:rgba(91,140,255,.20); --pillLine:rgba(91,140,255,.34);
    --shadow:0 18px 40px rgba(0,0,0,.45);
  }
  html[data-theme="light"]{
    --bg:#f3f5fa; --bg2:#eef2f9; --card:#ffffff; --card2:#f8fafe;
    --line:rgba(16,24,40,.10); --text:#101828; --dim:#5b6577; --faint:#8c95a6;
    --blue:#3d6bff; --cyan:#0e9bb5; --ok:#0f9d63; --warn:#b45309; --red:#dc2626;
    --glass:rgba(255,255,255,.88); --pill:rgba(61,107,255,.14); --pillLine:rgba(61,107,255,.30);
    --shadow:0 18px 40px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Noto Sans SC","PingFang SC",system-ui,sans-serif}
  body{min-height:100vh;background:
      radial-gradient(760px 380px at 12% -6%, rgba(91,140,255,.16), transparent 62%),
      radial-gradient(600px 320px at 100% 26%, rgba(34,211,238,.08), transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg))}
  .app{padding:16px 16px 128px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .muted{color:var(--faint);font-size:10.5px}
  .head h1{margin:0;font-size:19px;font-weight:900;letter-spacing:2.5px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
    font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--card)}
  .dot{width:6px;height:6px;border-radius:999px;background:currentColor}
  .iconbtn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:15px}
  .hero{margin-top:14px;padding:18px 16px 16px;border-radius:26px;background:var(--card);
    border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}
  .orb{width:126px;height:126px;margin:4px auto 0;border-radius:999px;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 34%, rgba(91,140,255,.20), rgba(91,140,255,.03) 62%, transparent 72%);
    border:1px solid var(--line);transition:.35s}
  .orb.on{background:radial-gradient(circle at 50% 32%, #6f9bff, #2f56e0 58%, #1c2f8f);
    box-shadow:0 0 44px rgba(91,140,255,.45), inset 0 0 26px rgba(255,255,255,.12);border-color:transparent}
  .orb .ico{font-size:32px;line-height:1}
  .orb .lbl{margin-top:3px;font-size:11px;color:rgba(255,255,255,.86)}
  .orb:not(.on) .lbl{color:var(--faint)}
  .state{margin-top:12px;font-size:14px;font-weight:600}
  .substate{margin-top:3px;font-size:11px;color:var(--faint)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .stat{padding:12px 13px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
  .stat .k{font-size:10px;color:var(--faint)}
  .stat .v{margin-top:5px;font-size:16px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
  .stat .t{margin-top:2px;font-size:9.5px;color:var(--faint)}
  .seg{display:flex;gap:6px;margin-top:12px;padding:5px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
  .seg .it{flex:1;text-align:center;padding:9px;border-radius:12px;font-size:12.5px;color:var(--dim)}
  .seg .it.on{background:var(--pill);border:1px solid var(--pillLine);color:var(--blue);font-weight:600}
  .card{margin-top:12px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
  .ttl{font-size:10.5px;color:var(--faint)}
  .big{font-size:15px;font-weight:600;margin-top:5px}
  .badge{font-size:10px;padding:3px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
  .list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
  .item.sel{border-color:var(--pillLine);background:var(--pill)}
  .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb{font-size:9.5px;color:var(--faint);margin-top:2px}
  .url{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
  .item .btn{flex:0 0 auto}
  .g{color:var(--ok)} .y{color:var(--warn)} .r{color:var(--red)}
  input{width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12.5px;outline:none}
  .btn{padding:9px 14px;border-radius:13px;font-size:12px;font-weight:600;border:1px solid transparent;background:var(--blue);color:#fff}
  .btn.ghost{background:var(--card2);border-color:var(--line);color:var(--dim)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-top:12px}
  .chip{flex:0 0 auto;padding:8px 12px;border-radius:12px;font-size:12px;border:1px solid var(--line);background:var(--card2);color:var(--dim)}
  .chip.on{background:var(--pill);border-color:var(--pillLine);color:var(--blue);font-weight:600}
  pre{margin:0;font-size:10.5px;line-height:1.55;color:var(--dim);white-space:pre-wrap;word-break:break-all}
  .scroll{max-height:46vh;overflow:auto}
  .nlist{overflow:visible}
  .empty{text-align:center;color:var(--faint);font-size:12px;padding:26px 0}
  .nav{z-index:5;position:fixed;left:16px;right:16px;bottom:14px;height:62px;border-radius:24px;background:var(--glass);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);
    box-shadow:var(--shadow);display:flex;align-items:center;overflow:hidden}
  .nav .npill{position:absolute;top:7px;left:0;width:60px;height:46px;border-radius:16px;
    background:var(--pill);border:1px solid var(--pillLine);transition:transform .38s cubic-bezier(.34,1.4,.64,1),width .38s ease}
  .nav .tab{position:relative;flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:10px;z-index:1}
  .nav .tab.on{color:var(--blue);font-weight:600}
  .nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fade{position:fixed;left:0;right:0;bottom:0;height:104px;pointer-events:none;z-index:2;
    background:linear-gradient(180deg,transparent,var(--bg) 62%)}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);background:var(--glass);
    border:1px solid var(--line);color:var(--text);padding:10px 15px;border-radius:14px;font-size:12px;opacity:0;transition:.25s;max-width:86vw;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="row head">
    <div class="grow"><h1>TUNCLASH</h1><div class="muted" style="margin-top:3px" id="headSub">模块 · WebUI</div></div>
    <span class="pill" id="pill" style="color:var(--faint)"><i class="dot"></i><span id="pillText">检测中</span></span>
    <button class="iconbtn" id="themeBtn" onclick="toggleTheme()">☾</button>
  </div>
  <div id="view"></div>
</div>
<nav class="nav">
  <div class="npill" id="navPill"></div>
  <div class="tab on" onclick="tab('home')"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg><span>概览</span></div>
  <div class="tab" onclick="tab('nodes')"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>节点</span></div>
  <div class="tab" onclick="tab('subs')"><svg viewBox="0 0 24 24"><path d="M7 17a4 4 0 0 1 .6-8 5.5 5.5 0 0 1 10.5 1.6A3.6 3.6 0 0 1 17.5 18H7z"/></svg><span>订阅</span></div>
  <div class="tab" onclick="tab('logs')"><svg viewBox="0 0 24 24"><path d="m5 7 4 5-4 5M12 17h7"/></svg><span>日志</span></div>
</nav>
<div class="fade"></div>
<div class="toast" id="toast"></div>
<script>
const DIR="/data/adb/mihomo_tproxy", API="http://127.0.0.1:9090";
const KSU=window.ksu||window.kernelsu||null;
let secret="";
const state={running:false,mode:"rule",groups:[],nodes:{},current:"",tab:"home",search:"",sort:false,level:"all",q:"",version:""};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);}
async function sh(cmd){
  if(!KSU) throw new Error("no ksu");
  const r = await KSU.exec(cmd);
  let out = "";
  if (typeof r === "string") {
    out = r;
    const t = r.trim();
    if (t.charAt(0) === "{") { try { const j = JSON.parse(t); if (j && typeof j.stdout === "string") out = j.stdout; } catch(e){} }
  } else if (r && r.stdout != null) {
    out = String(r.stdout);
  }
  return out.replace(/\r/g, "").replace(/\s+$/, "");
}
function b64(s){return btoa(unescape(encodeURIComponent(s)));}
async function writeFile(p,t){await sh("printf '%s' '"+b64(t)+"' | base64 -d > '"+p+"'");}
async function api(path,method,body){let c="curl -s -m 6 -H 'Authorization: Bearer "+secret+"' ";if(method&&method!=="GET"){if(body!==undefined){await writeFile("/data/local/tmp/.tc_body.json",body);c+="-X "+method+" -H 'Content-Type: application/json' --data-binary @/data/local/tmp/.tc_body.json ";}else c+="-X "+method+" ";}c+="'"+API+path+"'";const o=await sh(c);if(!o)return null;try{return JSON.parse(o);}catch(e){return null;}}
async function loadSecret(){secret=await sh("cat "+DIR+"/secret 2>/dev/null");if(!secret)secret=await sh("grep '^secret:' "+DIR+"/data/config.yaml | head -1 | sed 's/.*: *//' | tr -d '\"'");}
function fmt(v){v=Number(v)||0;if(v<1024)return Math.round(v)+" B";if(v<1048576)return (v/1024).toFixed(1)+" KB";if(v<1073741824)return (v/1048576).toFixed(1)+" MB";return (v/1073741824).toFixed(2)+" GB";}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("tc-theme",t);const b=document.getElementById("themeBtn");if(b)b.textContent=t==="light"?"☀":"☾";}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==="light"?"dark":"light");}
async function refresh(){try{await loadSecret();const pid=await sh("sh "+DIR+"/ctl.sh status");state.running=pid.indexOf("running")>=0;const ver=state.running?await api("/version"):null;const cfg=state.running?await api("/configs"):null;state.mode=(cfg&&cfg.mode)||"rule";const px=state.running?await api("/proxies"):null;if(px&&px.proxies){state.groups=[];state.nodes={};
      var BUILTIN0={DIRECT:1,REJECT:1,"REJECT-DROP":1,PASS:1,"PASS-RULE":1,COMPATIBLE:1};
      for(const k in px.proxies){const p=px.proxies[k];if(p.all)state.groups.push(p);else if(!BUILTIN0[k])state.nodes[k]=p;}state.groups.sort((a,b)=>(a.name==="🚀 节点选择"?-1:0)-(b.name==="🚀 节点选择"?-1:0));const g=state.groups.find(x=>x.name==="🚀 节点选择")||state.groups.find(x=>x.type==="Selector")||state.groups[0];state.current=g?g.now:"";}state.version=ver?ver.version:"";
    // provider nodes live inside group.all rather than at the top level of /proxies
    var groupNames={}; state.groups.forEach(function(g){ groupNames[g.name]=1; });
    var BUILTIN={DIRECT:1,REJECT:1,"REJECT-DROP":1,PASS:1,"PASS-RULE":1,COMPATIBLE:1};
    state.groups.forEach(function(g){ (g.all||[]).forEach(function(n){ if(!groupNames[n]&&!BUILTIN[n]&&!state.nodes[n]) state.nodes[n]={name:n,type:"provider",history:[]}; }); });
    renderStatus();}catch(e){state.running=false;renderStatus();}}
function renderStatus(){const p=document.getElementById("pill");const paused=state.running&&state.mode==="direct";const c=!state.running?"var(--faint)":paused?"var(--warn)":"var(--ok)";p.style.color=c;document.getElementById("pillText").textContent=!state.running?"未运行":paused?"已暂停":"运行中";document.getElementById("headSub").textContent=(state.version?"内核 "+state.version+" · ":"")+Object.keys(state.nodes).length+" 个节点";}
function movePill(i){
  const nav=document.querySelector(".nav"), pill=document.getElementById("navPill");
  if(!nav||!pill) return;
  const slot=nav.clientWidth/4, pad=7, w=slot-pad*2;
  pill.style.width=w+"px";
  pill.style.transform="translateX("+(i*slot+pad)+"px)";
}
function tab(t){state.tab=t;const order=["home","nodes","subs","logs"];document.querySelectorAll(".nav .tab").forEach((el,i)=>el.classList.toggle("on",order[i]===t));movePill(order.indexOf(t));render();}
function render(){const v=document.getElementById("view");if(state.tab==="home")return renderHome(v);if(state.tab==="nodes")return renderNodes(v);if(state.tab==="subs")return renderSubs(v);return renderLogs(v);}
function renderHome(v){const cur=state.current||"未选择";v.innerHTML='<div class="hero"><div class="orb '+(state.running&&state.mode!=="direct"?"on":"")+'" onclick="toggle()"><div style="display:flex;flex-direction:column;align-items:center"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="'+(state.running?"#fff":"var(--dim)")+'" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg><div class="lbl">'+(state.running?(state.mode==="direct"?"已暂停":"已连接"):"未连接")+'</div></div></div><div class="state">'+(!state.running?"内核未运行":state.mode==="direct"?"内核运行中 · 流量直连":"正在接管全部流量")+'</div><div class="substate">'+(state.running?"TUN · 已接管":"点击圆环启动")+'</div></div>'+'<div class="stats"><div class="stat"><div class="k">↑ 上传</div><div class="v" style="color:var(--cyan)" id="up">0 B/s</div><div class="t" id="upT">累计 0 B</div></div><div class="stat"><div class="k">↓ 下载</div><div class="v" style="color:var(--ok)" id="down">0 B/s</div><div class="t" id="downT">累计 0 B</div></div></div>'+'<div class="seg">'+["rule","global","direct"].map(m=>'<div class="it '+(state.mode===m?"on":"")+'" onclick="setMode(\''+m+'\')">'+({rule:"规则",global:"全局",direct:"直连"})[m]+'</div>').join("")+'</div>'+'<div class="card"><div class="ttl">当前节点</div><div class="big">'+esc(cur)+'</div><div class="row" style="margin-top:6px"><div class="grow muted">'+state.groups.length+' 个策略组 · '+Object.keys(state.nodes).length+' 个节点</div><button class="btn ghost" onclick="refresh().then(render)">刷新</button></div></div>'+'<div class="card"><div class="row" style="justify-content:space-between"><button class="btn ghost" onclick="updateCore()">更新内核</button><button class="btn ghost" onclick="restartCore()">重启内核</button><button class="btn ghost" onclick="toggle()">'+(state.running?"暂停 / 恢复":"启动")+'</button></div></div>';pollTraffic();}
async function renderNodes(v){const gs=state.groups;if(!window.__g&&gs[0])window.__g=gs[0].name;const g=gs.find(x=>x.name===window.__g)||gs[0];const q=(state.search||"").toLowerCase();const gnames={};gs.forEach(x=>gnames[x.name]=1);
  let ns=(g&&g.all?g.all:[]).filter(n=>state.nodes[n]&&!gnames[n]).filter(n=>!q||n.toLowerCase().includes(q));if(state.sort)ns=ns.slice().sort((a,b)=>{const da=(state.nodes[a]&&state.nodes[a].history&&state.nodes[a].history.slice(-1)[0]?state.nodes[a].history.slice(-1)[0].delay:0)||0;const db=(state.nodes[b]&&state.nodes[b].history&&state.nodes[b].history.slice(-1)[0]?state.nodes[b].history.slice(-1)[0].delay:0)||0;return (da<=0?1e9:da)-(db<=0?1e9:db);});v.innerHTML='<div class="chips">'+gs.map(x=>'<div class="chip '+(x.name===window.__g?"on":"")+'" onclick="pickGroup(\''+encodeURIComponent(x.name)+'\')">'+esc(x.name)+'</div>').join("")+'</div>'+'<div style="margin-top:10px"><input placeholder="搜索节点 / 地区" value="'+esc(state.search)+'" oninput="state.search=this.value;render()"></div>'+'<div class="row" style="margin-top:8px;justify-content:space-between"><div class="row" style="gap:8px"><div class="chip '+(state.sort?"on":"")+'" onclick="state.sort=!state.sort;render()">按延迟排序</div><span class="muted">'+ns.length+' 个节点</span></div><button class="btn ghost" onclick="speedTest()">测速本组</button></div>'+'<div class="list nlist">'+(ns.length?ns.map(n=>{const p=state.nodes[n]||{};const d=(p.history&&p.history.length)?p.history[p.history.length-1].delay:0;const cls=d>0?(d<200?"g":d<500?"y":"r"):"";return '<div class="item '+(g.now===n?"sel":"")+'" onclick="selectNode(\''+encodeURIComponent(g.name)+'\',\''+encodeURIComponent(n)+'\')"><div class="grow"><div class="nm">'+esc(n)+'</div><div class="sb">'+esc(p.type||"")+'</div></div><div class="badge '+cls+'">'+(d>0?d+"ms":"—")+'</div></div>';}).join(""):'<div class="empty">该组暂无节点</div>')+'</div>';}

function b64d(s){s=String(s||"").replace(/-/g,"+").replace(/_/g,"/").trim();while(s.length%4)s+="=";try{return decodeURIComponent(escape(atob(s)));}catch(e){try{return atob(s);}catch(e2){return "";}}}
function qsp(u){const i=u.indexOf("?");const o={};if(i<0)return o;u.slice(i+1).split("#")[0].split("&").forEach(function(kv){if(!kv)return;const k=kv.split("=")[0];o[decodeURIComponent(k)]=decodeURIComponent(kv.slice(k.length+1)||"");});return o;}
function fragOf(u){const i=u.indexOf("#");return i>=0?decodeURIComponent(u.slice(i+1)):"";}
function ysq(v){return "'"+String(v==null?"":v).replace(/'/g,"''")+"'";}
function portOf(s){const n=parseInt(s,10);return isNaN(n)?443:n;}
var JUNK=/剩余流量|套餐|到期|过期|已用流量|重置|官网|订阅|客服|试用|流量/;
function linkToClash(link){
  const scheme=link.split("://")[0].toLowerCase();
  const body=link.slice(scheme.length+3);
  const noFrag=body.split("#")[0];
  const name=fragOf(body);
  if(name&&JUNK.test(name))return null;
  if(scheme==="vmess"){
    let j;try{j=JSON.parse(b64d(noFrag));}catch(e){return null;}
    if(!j||!j.add)return null;
    const nm=j.ps||name||j.add; if(JUNK.test(nm))return null;
    const net=j.net||"tcp";
    const p=["name: "+ysq(nm),"type: vmess","server: "+ysq(j.add),"port: "+portOf(j.port),"uuid: "+ysq(j.id),"alterId: "+(parseInt(j.aid||"0",10)||0),"cipher: "+ysq(j.scy||"auto"),"udp: true"];
    if(j.tls==="tls"){p.push("tls: true");if(j.sni||j.host)p.push("servername: "+ysq(j.sni||j.host));}
    p.push("network: "+ysq(net));
    if(net==="ws")p.push("ws-opts: { path: "+ysq(j.path||"/")+", headers: { Host: "+ysq(j.host||j.add)+" } }");
    return "- { "+p.join(", ")+" }";
  }
  const at=noFrag.lastIndexOf("@"); if(at<0)return null;
  const cred=noFrag.slice(0,at);
  const hp=noFrag.slice(at+1).split("/")[0].split(":");
  const host=hp[0],port=portOf(hp[1]);
  const q=qsp(noFrag);
  const insecure=q.insecure==="1"||q.insecure==="true"||q.allowInsecure==="1";
  if(!host||JUNK.test(name||""))return null;
  const nm2=name||(host+":"+port);
  if(scheme==="vless"){
    const p=["name: "+ysq(nm2),"type: vless","server: "+ysq(host),"port: "+port,"uuid: "+ysq(cred),"udp: true","network: "+ysq(q.type||"tcp")];
    if(q.security==="tls"||q.security==="reality"){p.push("tls: true");if(q.sni||q.host)p.push("servername: "+ysq(q.sni||q.host));if(q.fp)p.push("client-fingerprint: "+ysq(q.fp));if(q.security==="reality")p.push("reality-opts: { public-key: "+ysq(q.pbk||"")+", short-id: "+ysq(q.sid||"")+" }");}
    if(q.flow)p.push("flow: "+ysq(q.flow));
    if((q.type||"")==="ws")p.push("ws-opts: { path: "+ysq(q.path||"/")+", headers: { Host: "+ysq(q.host||host)+" } }");
    if(insecure)p.push("skip-cert-verify: true");
    return "- { "+p.join(", ")+" }";
  }
  if(scheme==="trojan"){
    const p=["name: "+ysq(nm2),"type: trojan","server: "+ysq(host),"port: "+port,"password: "+ysq(cred),"udp: true"];
    if(q.sni)p.push("sni: "+ysq(q.sni));
    if(q.type==="ws")p.push("network: ws","ws-opts: { path: "+ysq(q.path||"/")+", headers: { Host: "+ysq(q.host||host)+" } }");
    if(insecure)p.push("skip-cert-verify: true");
    return "- { "+p.join(", ")+" }";
  }
  if(scheme==="hysteria2"||scheme==="hy2"){
    const p=["name: "+ysq(nm2),"type: hysteria2","server: "+ysq(host),"port: "+port,"password: "+ysq(decodeURIComponent(cred))];
    if(q.sni)p.push("sni: "+ysq(q.sni));
    if(q.obfs){p.push("obfs: "+ysq(q.obfs));if(q["obfs-password"])p.push("obfs-password: "+ysq(q["obfs-password"]));}
    if(insecure)p.push("skip-cert-verify: true");
    return "- { "+p.join(", ")+" }";
  }
  if(scheme==="anytls"){
    const p=["name: "+ysq(nm2),"type: anytls","server: "+ysq(host),"port: "+port,"password: "+ysq(decodeURIComponent(cred)),"udp: true"];
    if(q.sni)p.push("sni: "+ysq(q.sni));
    if(q.fp)p.push("client-fingerprint: "+ysq(q.fp));
    if(insecure)p.push("skip-cert-verify: true");
    return "- { "+p.join(", ")+" }";
  }
  if(scheme==="tuic"){
    const cp=cred.split(":");
    const p=["name: "+ysq(nm2),"type: tuic","server: "+ysq(host),"port: "+port,"uuid: "+ysq(cp[0]||""),"password: "+ysq(decodeURIComponent(cp[1]||"")),"udp: true"];
    if(q.sni)p.push("sni: "+ysq(q.sni));
    if(insecure)p.push("skip-cert-verify: true");
    return "- { "+p.join(", ")+" }";
  }
  if(scheme==="ss"){
    let method,pass;
    if(cred.indexOf(":")>=0){const m=cred.split(":");method=m[0];pass=m.slice(1).join(":");}
    else{const d=b64d(cred);method=d.split(":")[0];pass=d.split(":").slice(1).join(":");}
    return "- { name: "+ysq(nm2)+", type: ss, server: "+ysq(host)+", port: "+port+", cipher: "+ysq(method)+", password: "+ysq(pass)+", udp: true }";
  }
  return null;
}
function shareToYaml(text){
  let raw=String(text||"").trim();
  if(!/\w+:\/\//.test(raw)) raw=b64d(raw);
  const out=[];
  raw.split(/\r?\n/).forEach(function(line){const l=line.trim();if(!l||l.charAt(0)==="#")return;const y=linkToClash(l);if(y)out.push(y);});
  return out.length?("proxies:\n"+out.join("\n")+"\n"):"";
}
async function convertShareSub(idx){
  const raw=await sh("cat "+DIR+"/data/sub"+idx+".yaml 2>/dev/null");
  if(!raw) return 0;
  if(raw.indexOf("proxies:")>=0) return 0;
  const y=shareToYaml(raw);
  if(!y) return 0;
  const n=(y.match(/^- \{/gm)||[]).length;
  if(n>0) await writeFile(DIR+"/data/p"+idx+".yaml", y);
  return n;
}
async function renderSubs(v){
  const n = parseInt(await sh("wc -l < "+DIR+"/subs.list 2>/dev/null") || "0", 10) || 0;
  const rows = [];
  for (let k = 0; k < n; k++) {
    const line = await sh("sed -n '" + (k+1) + "p' " + DIR + "/subs.list 2>/dev/null");
    if (!line) continue;
    const p = line.split("|");
    rows.push({ name: p[0] || "", url: p[1] || "", count: 0, clash: false, mtime: "" });
  }for (let i = 0; i < rows.length; i++) {
    const c = parseInt(await sh("grep -c 'name:' " + DIR + "/data/p" + i + ".yaml 2>/dev/null") || "0", 10) || 0;
    rows[i].count = c;
    rows[i].clash = c > 0;
    rows[i].mtime = await sh("stat -c %y " + DIR + "/data/sub" + i + ".yaml 2>/dev/null | cut -d. -f1");
  }const total=rows.reduce((a,r)=>a+(r.count||0),0);v.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><div><div class="ttl">订阅概览</div><div class="big">'+rows.length+' 个订阅 · 可用 '+rows.filter(function(r){return r.clash}).length+' 个</div><div class="muted" style="margin-top:4px">provider 合计 '+total+' 个 · 运行中 '+Object.keys(state.nodes).length+' 个</div></div><div class="badge">provider</div></div></div>'+'<div class="card"><div class="ttl">添加 Clash 订阅</div><div style="margin-top:8px"><input id="subUrl" placeholder="https://..."></div><div class="row" style="margin-top:8px"><input id="subName" placeholder="备注名（可选）" style="flex:1"><button class="btn" onclick="addSub()">添加</button></div></div>'+'<div class="list">'+(rows.length?rows.map((r,i)=>'<div class="item"><div class="grow"><div class="nm">'+esc(r.name)+'</div><div class="sb url">'+esc(r.url)+'</div>'+(r.mtime?'<div class="sb">'+esc(r.mtime)+'</div>':'')+'</div>'+(r.clash?'<div class="badge">'+r.count+' 节点</div>':'<div class="badge" style="color:var(--warn)">分享链接</div>')+'<button class="btn ghost" onclick="delSub('+i+')">删除</button></div>').join(""):'<div class="empty">还没有订阅</div>')+'</div>'+'<div class="card"><div class="row" style="justify-content:space-between"><button class="btn ghost" onclick="updateSubs()">更新全部</button><button class="btn ghost" onclick="refresh().then(render)">刷新</button></div></div>';}
let logTimer=null;
function filterLog(t){return (t||"").split("\n").filter(l=>{if(state.level==="warn")return /warn/i.test(l);if(state.level==="error")return /error|fatal/i.test(l);return true;}).filter(l=>!state.q||l.toLowerCase().includes(state.q.toLowerCase())).join("\n")||"暂无日志";}
async function renderLogs(v){clearInterval(logTimer);const log=await sh("tail -n 120 "+DIR+"/logs/core.log 2>/dev/null");v.innerHTML='<div class="row" style="gap:8px"><div style="flex:1"><input placeholder="搜索日志" value="'+esc(state.q)+'" oninput="state.q=this.value;render()"></div><button class="btn ghost" onclick="copyLogs()">复制</button><button class="btn ghost" onclick="clearLogs()">清空</button></div>'
    +'<div class="muted" style="margin-top:8px" id="loginfo">共 '+String(log||"").split("\n").length+' 行</div>'+'<div class="chips" style="margin-top:10px">'+[["all","全部"],["warn","警告"],["error","错误"]].map(([k,l])=>'<div class="chip '+(state.level===k?"on":"")+'" onclick="state.level=\''+k+'\';render()">'+l+'</div>').join("")+'</div>'+'<div class="card scroll" style="margin-top:10px"><pre id="logbox">'+esc(filterLog(log))+'</pre></div>';const b=document.getElementById("logbox");if(b)b.scrollTop=b.scrollHeight;logTimer=setInterval(async()=>{if(state.tab!=="logs"){clearInterval(logTimer);return;}const x=document.getElementById("logbox");if(!x)return;const t=await sh("tail -n 120 "+DIR+"/logs/core.log 2>/dev/null");x.textContent=filterLog(t||"");x.scrollTop=x.scrollHeight;},3000);}
async function clearLogs(){await sh(": > "+DIR+"/logs/core.log");toast("已清空");render();}
async function toggle(){try{if(!state.running){toast("启动中…");await sh("sh "+DIR+"/ctl.sh start");}else{const n=state.mode==="direct"?"rule":"direct";await api("/configs","PATCH",JSON.stringify({mode:n}));toast(n==="direct"?"已暂停":"已恢复");}}catch(e){toast("操作失败");}setTimeout(()=>refresh().then(render),800);}
async function setMode(m){try{await api("/configs","PATCH",JSON.stringify({mode:m}));toast("已切换模式");}catch(e){}setTimeout(()=>refresh().then(render),500);}
async function restartCore(){toast("重启中…");await sh("sh "+DIR+"/ctl.sh restart");setTimeout(()=>refresh().then(render),1500);}
async function pickGroup(n){window.__g=decodeURIComponent(n);render();}
async function selectNode(g,n){await api("/proxies/"+g,"PUT",JSON.stringify({name:decodeURIComponent(n)}));toast("已切换节点");setTimeout(()=>refresh().then(render),500);}
async function speedTest(){const g=state.groups.find(x=>x.name===window.__g)||state.groups[0];if(!g)return;toast("测速中…");const r=await api("/group/"+encodeURIComponent(g.name)+"/delay?url="+encodeURIComponent("http://www.gstatic.com/generate_204")+"&timeout=3000");if(!r){toast("测速失败");return;}for(const k in r)if(state.nodes[k])state.nodes[k].history=[{delay:r[k]}];const best=Object.keys(r).filter(k=>r[k]>0).sort((a,b)=>r[a]-r[b])[0];if(best)await api("/proxies/"+encodeURIComponent(g.name),"PUT",JSON.stringify({name:best}));toast(best?"最快："+best+" "+r[best]+"ms":"全部超时");setTimeout(()=>refresh().then(render),600);}
async function updateCore(){toast("检查更新…");await sh("nohup sh "+DIR+"/update_core.sh >/dev/null 2>&1 &");for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,3000));const t=await sh("tail -n 2 "+DIR+"/logs/update.log 2>/dev/null");if(t){toast(t.trim().split("\n").pop());if(/updated to|already latest|failed/.test(t))break;}}refresh().then(render);}
async function addSub(){const u=(document.getElementById("subUrl").value||"").trim();const n=(document.getElementById("subName").value||"").trim()||("订阅 "+Date.now().toString().slice(-4));if(!u.startsWith("http")){toast("请输入 http(s) 订阅链接");return;}if(/['"\s]/.test(u)){toast("链接包含非法字符");return;}toast("下载订阅…");const idx=Number(await sh("ls "+DIR+"/data/sub*.yaml 2>/dev/null | wc -l"));const r=await sh("curl -L --max-time 40 -o "+DIR+"/data/sub"+idx+".yaml '"+u+"' && echo ok");if(r.indexOf("ok")<0){toast("下载失败");return;}await sh("printf '%s\\n' '"+(n.replace(/'/g,""))+"|"+u+"' >> "+DIR+"/subs.list");
  const conv=await convertShareSub(idx); if(conv>0) toast("已转换 "+conv+" 个分享链接节点");await sh("sh "+DIR+"/gen.sh >/dev/null 2>&1 && sh "+DIR+"/ctl.sh restart");setTimeout(()=>refresh().then(render),1500);}
async function delSub(i){const raw=await sh("cat "+DIR+"/subs.list");const rows=raw.split("\n").filter(Boolean).filter((_,k)=>k!==i);await writeFile(DIR+"/subs.list",rows.join("\n")+(rows.length?"\n":""));await sh("sh "+DIR+"/gen.sh >/dev/null 2>&1 && sh "+DIR+"/ctl.sh restart");toast("已删除");setTimeout(()=>refresh().then(render),1200);}
async function updateSubs(){const raw=await sh("cat "+DIR+"/subs.list");const rows=raw.split("\n").filter(Boolean).map(l=>l.split("|"));toast("更新中…");for(let i=0;i<rows.length;i++){const u=rows[i][1];if(u){await sh("curl -L --max-time 40 -o "+DIR+"/data/sub"+i+".yaml '"+u+"'");await convertShareSub(i);}}await sh("sh "+DIR+"/gen.sh >/dev/null 2>&1 && sh "+DIR+"/ctl.sh restart");toast("已更新");setTimeout(()=>refresh().then(render),1200);}
let lastT=0,lastUp=0,lastDown=0;
async function pollTraffic(){if(!state.running)return;const c=await api("/connections");if(!c)return;const up=Number(c.uploadTotal||0),down=Number(c.downloadTotal||0),now=Date.now();if(lastT){const dt=Math.max((now-lastT)/1000,.5);const u=document.getElementById("up"),d=document.getElementById("down");if(u)u.textContent=fmt(Math.max(0,(up-lastUp)/dt))+"/s";if(d)d.textContent=fmt(Math.max(0,(down-lastDown)/dt))+"/s";}const ut=document.getElementById("upT"),dt2=document.getElementById("downT");if(ut)ut.textContent="累计 "+fmt(up);if(dt2)dt2.textContent="累计 "+fmt(down);lastT=now;lastUp=up;lastDown=down;}
function boot(){applyTheme(localStorage.getItem("tc-theme")||"dark");window.addEventListener("resize",()=>movePill(["home","nodes","subs","logs"].indexOf(state.tab)));refresh().then(()=>tab("home"));setInterval(()=>{refresh().then(render);},7000);setInterval(pollTraffic,2000);}
boot();
</script>
