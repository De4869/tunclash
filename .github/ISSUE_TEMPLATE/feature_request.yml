name: 功能建议
description: 想要的新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: 现在每次……很麻烦，希望能……
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 期望的做法
  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - App 界面
        - 分流 / 规则
        - 订阅管理
        - 模块 / WebUI
        - 其他
