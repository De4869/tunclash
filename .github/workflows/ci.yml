name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependencies (mihomo + geo)
        run: bash scripts/fetch-deps.sh

      - name: Unit tests
        run: cd Android && ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build
        run: cd Android && ./gradlew assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
