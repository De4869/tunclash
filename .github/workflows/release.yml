name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Fetch core + geo
        run: bash scripts/fetch-deps.sh

      - name: Build APK
        run: |
          cd Android
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Package artifacts
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          cp Android/app/build/outputs/apk/debug/app-debug.apk "MihomoTProxy-${TAG}.apk"
          (cd module && zip -qr "../MihomoTProxy-Module-${TAG}.zip" .)
          python3 - "$TAG" <<'PY'
          import json, os, sys
          tag = sys.argv[1]
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
              "version": tag,
              "versionCode": 1,
              "zipUrl": f"https://github.com/{repo}/releases/download/{tag}/MihomoTProxy-Module-{tag}.zip",
              "changelog": f"https://raw.githubusercontent.com/{repo}/main/CHANGELOG.md",
          }
          json.dump(data, open("update.json", "w"), ensure_ascii=False, indent=2)
          PY
          ls -lh MihomoTProxy-* update.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MihomoTProxy-*.apk
            MihomoTProxy-Module-*.zip
            update.json
